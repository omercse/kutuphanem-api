spring.application.name=kutuphanem-api

# ---------------------------------------------------------------
# Veritabani
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kutuphane_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# Semayi artik Hibernate degil Flyway yonetiyor.
# validate: Hibernate acilista entity'ler ile gercek semayi karsilastirir,
# uyusmazlik varsa uygulama baslamaz. Tablo olusturmaz, silmez.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Lazy loading sorunlarinin HTTP cevabi yazilirken gizlenmesini engeller.
spring.jpa.open-in-view=false

# ---------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Icinde zaten tablo bulunan bir veritabaninda ilk calistirmada
# mevcut semayi V1 kabul eder. Bos veritabaninda etkisizdir.
spring.flyway.baseline-on-migrate=true

# ---------------------------------------------------------------
# Dosya yukleme
# ---------------------------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---------------------------------------------------------------
# Guvenlik / JWT
# Varsayilan deger YOK: eksikse uygulama acilista hata verir.
# ---------------------------------------------------------------
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---------------------------------------------------------------
# Ilk ADMIN kullanicisi (bos birakilirsa admin olusturulmaz)
# ---------------------------------------------------------------
application.bootstrap.admin.email=${ADMIN_EMAIL:}
application.bootstrap.admin.password=${ADMIN_PASSWORD:}

# ---------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------
# Gemini
# ---------------------------------------------------------------
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=gemini-3.1-flash-lite
gemini.base-url=https://generativelanguage.googleapis.com/v1/models